# Ostra's services on Robinhood Chain behind nginx; certbot --nginx adds TLS to these server blocks.
# nginx sets CF-Connecting-IP from the connection's address, replacing any value a client sends, so the
# relayer and the RPC proxy (OSTRA_*_CLIENT_IP=cf-connecting-ip) count rates per real client. Behind
# Cloudflare, set it from Cloudflare's header instead (with set_real_ip_from for Cloudflare's ranges).

server {
    listen 80;
    listen [::]:80;
    server_name relayer.ostraagent.xyz;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

