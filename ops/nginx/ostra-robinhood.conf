# Ostra's services on Robinhood Chain, behind Cloudflare (proxied DNS: the VPS address is in no public
# record). Rendered by ops/nginx/render-cloudflare.py with Cloudflare's published address ranges
# (https://www.cloudflare.com/ips-v4 and /ips-v6) in place of the marker in the geo map, and installed as
# /etc/nginx/sites-available/ostra-robinhood.conf.
#
# - Only connections from Cloudflare are served (geo on $realip_remote_addr, the connection's own
#   address); any other connection, such as one made to the VPS address directly, is closed (444).
# - The client's address is taken from Cloudflare's CF-Connecting-IP only on those connections
#   (realip, snippets/ostra-cloudflare-realip.conf), and passed on as CF-Connecting-IP, which the
#   relayer and the RPC proxy (OSTRA_*_CLIENT_IP=cf-connecting-ip) count their rates by.
# - TLS between Cloudflare and the VPS uses a Cloudflare origin certificate whose key was made on
#   the VPS (/etc/ostra/tls); Cloudflare's SSL mode is Full (strict).

geo $realip_remote_addr $ostra_from_cloudflare {
    default 0;
@CLOUDFLARE_GEO@
}

# Uploads to IPFS (the uploader, /v1/ipfs/ on the relayer's host): at most 30 a minute per client address.
limit_req_zone $binary_remote_addr zone=ostra_upload:10m rate=30r/m;
# Reads of the files the uploader keeps (GET /v1/ipfs/<raw CID>): their own, wider limit, so an agent reading jobs
# does not use up its uploads.
limit_req_zone $binary_remote_addr zone=ostra_ipfs_read:10m rate=300r/m;
# Ostrapad's encrypted files (private jobs, uploader/src/enc.ts): starts, 8 MiB chunks and finishes of uploads, and
# reservations, at most 60 a minute per client address.
limit_req_zone $binary_remote_addr zone=ostra_enc:10m rate=60r/m;
# The remote MCP gateway (mcp.ostraagent.xyz): what people's browsers call (the OAuth authorize redirect, the web app's
# connect and approve requests), at most 60 a minute per client address. What Claude's servers call (/mcp, /token,
# /register, the metadata) has no limit per address: every user's connector comes from Claude's own addresses, and the
# gateway caps sessions, session starts and registrations itself (mcp/src/remote.ts, remote-auth.ts).
limit_req_zone $binary_remote_addr zone=ostra_mcp_people:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name relayer.ostraagent.xyz keeper.ostraagent.xyz aggregator.ostraagent.xyz rpc.ostraagent.xyz mcp.ostraagent.xyz;
    if ($ostra_from_cloudflare = 0) {
        return 444;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name relayer.ostraagent.xyz;
    ssl_certificate /etc/ostra/tls/origin.pem;
    ssl_certificate_key /etc/ostra/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include snippets/ostra-cloudflare-realip.conf;
    if ($ostra_from_cloudflare = 0) {
        return 444;
    }
    # A private spend (OstraPrivatePool privateSwap or unshield) carries a ~75 KB STARK proof: about 151,000 hex
    # characters in its JSON; the relayer takes bodies of up to 256 KiB (relayer/src/http.ts MAX_BODY_BYTES).
    client_max_body_size 260k;
    # The uploader: images of up to 1 MB and small JSON files, pinned to IPFS (uploader/src/server.ts).
    location ~ "^/v1/ipfs/b[a-z2-7]{58}$" {
        limit_req zone=ostra_ipfs_read burst=100 nodelay;
        limit_req_status 429;
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://127.0.0.1:4800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # An encrypted file of up to 100 MB is streamed from disk to a reader that may be slow: not buffered here, and
        # the timeout is between two reads, never for the whole file.
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    # Uploads of encrypted files in chunks of 8 MiB, streamed to the uploader (it checks the upload and the chunk's size
    # before it reads the body), and reservations.
    location ^~ /v1/enc/ {
        limit_req zone=ostra_enc burst=20 nodelay;
        limit_req_status 429;
        limit_except GET POST PUT {
            deny all;
        }
        client_max_body_size 9m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /v1/ipfs/ {
        limit_req zone=ostra_upload burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 1100k;
        proxy_pass http://127.0.0.1:4800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
    }
    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name keeper.ostraagent.xyz;
