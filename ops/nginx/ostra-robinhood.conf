# The remote MCP gateway (mcp/src/remote.ts, ops/systemd/ostra-remote-mcp.service): the agent's MCP server over
# Streamable HTTP for Claude's custom connectors, and the OAuth that connects a vault's agent key to one.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.ostraagent.xyz;
    ssl_certificate /etc/ostra/tls/origin.pem;
    ssl_certificate_key /etc/ostra/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include snippets/ostra-cloudflare-realip.conf;
    if ($ostra_from_cloudflare = 0) {
        return 444;
    }
    # MCP messages are small JSON: the gateway takes bodies of up to 1 MiB (remote.ts MAX_BODY).
    client_max_body_size 1m;
    # The gateway's own health (its session counts) is for the VPS only.
    location = /health {
        return 404;
    }
    location ~ ^/(authorize$|connect/|approve/) {
        limit_req zone=ostra_mcp_people burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4920;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }
    location / {
        proxy_pass http://127.0.0.1:4920;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Answers and the GET stream are server-sent events: passed on as they come, never held back. The gateway sends
        # a keepalive comment on an open stream every 15 s (the MCP SDK's), within Cloudflare's 100 s and the timeout
        # here, which is between two reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
