[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# No metadata hash in the bytecode: it embeds the build's absolute paths, and the vault factory's
# CREATE2 addresses (and the SDK's copy of the BeaconProxy code) must not depend on where it was built.
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./vectors" }]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
